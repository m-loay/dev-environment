# Environment manifest. Sourced by the scripts in ../scripts.
# Edit here, not in the scripts.

# Python version for every managed environment.
# 3.12 is the intersection of: TensorFlow (cp310-cp313) and
# numpy>=2.5 / scipy>=1.18 (requires-python >= 3.12).
PYTHON_VERSION="3.12"

# Space-separated list of "name:requirements-file" pairs.
MANAGED_ENVS="ml-dev:ml-dev.txt llm-dev:llm-dev.txt"

# Where conda lives. Leave empty to auto-detect an existing installation
# (~/miniforge3, ~/mambaforge, ~/miniconda3, ~/anaconda3) and fall back to
# installing Miniforge into $HOME/miniforge3.
CONDA_ROOT=""

# Miniforge is preferred for a fresh machine: conda-forge by default and no
# Anaconda commercial-use licensing question. Set to 0 to refuse to install
# anything and require an existing conda.
ALLOW_CONDA_INSTALL=1
